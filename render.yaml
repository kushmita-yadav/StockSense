services:
  - type: web
    name: stocksense-api
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: '["https://stocksense-web.onrender.com"]'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: OTP_EXPIRE_MINUTES
        value: "10"
      - key: OTP_MAX_PER_HOUR
        value: "5"
      - key: LOGIN_MAX_FAILED_ATTEMPTS
        value: "10"

  - type: web
    name: stocksense-web
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_BASE_URL
        value: https://stocksense-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: stocksense-db
    databaseName: stocksense
    user: stocksense
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []